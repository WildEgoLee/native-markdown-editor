name: Windows Native Build & Test CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Set up Ninja
      uses: seanmiddleditch/gha-setup-ninja@v5

    - name: Install Qt 6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'

    - name: Configure CMake
      run: |
        cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

    - name: Build with Ninja
      run: |
        cmake --build build --config Release

    - name: Run Test Probes (CTest)
      run: |
        ctest --test-dir build --output-on-failure -C Release

    - name: Deploy Qt Runtime & Package Artifact
      run: |
        windeployqt --release --no-translations --compiler-runtime build/MarkdownNativeEditor.exe
        mkdir dist
        copy build\MarkdownNativeEditor.exe dist\
        copy build\*.dll dist\
        xcopy /E /I /Y build\platforms dist\platforms\
        xcopy /E /I /Y build\styles dist\styles\
        copy LICENSE dist\
        copy README.md dist\
        copy welcome.md dist\
        tar -czvf MarkdownNativeEditor-windows-x64.zip -C dist .

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MarkdownNativeEditor-windows-x64
        path: MarkdownNativeEditor-windows-x64.zip
