name: Windows Native Build & Test CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Set up Ninja
      uses: seanmiddleditch/gha-setup-ninja@v5

    - name: Install Qt 6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'

    - name: Configure CMake
      run: |
        cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

    - name: Build with Ninja
      run: |
        cmake --build build --config Release

    - name: Run Test Probes (CTest)
      env:
        QT_ASSUME_STDERR_HAS_CONSOLE: "1"
        QT_FORCE_STDERR_LOGGING: "1"
      run: |
        ctest --test-dir build --extra-verbose --output-on-failure -C Release

    - name: Deploy Qt Runtime & Package True ZIP Artifact
      shell: pwsh
      run: |
        windeployqt --release --no-translations --compiler-runtime build/MarkdownNativeEditor.exe
        New-Item -ItemType Directory -Force -Path dist | Out-Null
        Copy-Item build\MarkdownNativeEditor.exe dist\
        Copy-Item build\*.dll dist\ -ErrorAction SilentlyContinue
        Copy-Item -Recurse -Force build\platforms dist\platforms
        Copy-Item -Recurse -Force build\styles dist\styles -ErrorAction SilentlyContinue
        Copy-Item LICENSE, README.md, welcome.md dist\
        Compress-Archive -Path dist\* -DestinationPath MarkdownNativeEditor-windows-x64.zip -Force

    - name: Verify ZIP Integrity & Run Smoke Test
      shell: pwsh
      run: |
        # 1. Verify standard Windows extraction
        Expand-Archive -Path MarkdownNativeEditor-windows-x64.zip -DestinationPath dist_extracted -Force

        # 2. Verify file manifest
        $manifest = @(
            "dist_extracted\MarkdownNativeEditor.exe",
            "dist_extracted\Qt6Core.dll",
            "dist_extracted\Qt6Gui.dll",
            "dist_extracted\Qt6Widgets.dll",
            "dist_extracted\Qt6Svg.dll",
            "dist_extracted\platforms\qwindows.dll",
            "dist_extracted\LICENSE"
        )
        foreach ($file in $manifest) {
            if (-not (Test-Path $file)) {
                Write-Error "Missing critical package file: $file"
                exit 1
            }
        }
        Write-Host "File manifest check passed."

        # 3. Smoke test executable initialization and dependency resolution
        $p = Start-Process -FilePath "dist_extracted\MarkdownNativeEditor.exe" -ArgumentList "--smoke-test" -NoNewWindow -Wait -PassThru
        if ($p.ExitCode -ne 0) {
            Write-Error "Smoke test failed with exit code $($p.ExitCode)"
            exit 1
        }
        Write-Host "Smoke test passed: MarkdownNativeEditor.exe launched and resolved all dependencies cleanly."

        # 4. True GUI smoke test with MainWindow, layout, and document loading (with Chinese & spaces)
        New-Item -ItemType Directory -Force -Path "dist_extracted\测试 目录" | Out-Null
        $testDoc = "dist_extracted\测试 目录\示例文档 带有 空格.md"
        Set-Content -Path $testDoc -Value "# 欢迎使用原生 Markdown 编辑器`n`n这是包含 **中文** 与 *空格* 的测试文档。`n`n- 列表项 1`n- 列表项 2`n" -Encoding UTF8

        $guiP = Start-Process -FilePath "dist_extracted\MarkdownNativeEditor.exe" -ArgumentList @("--gui-smoke-test", "`"$testDoc`"") -NoNewWindow -Wait -PassThru
        if ($guiP.ExitCode -ne 0) {
            Write-Error "GUI smoke test failed with exit code $($guiP.ExitCode)"
            exit 1
        }
        Write-Host "GUI smoke test passed: MainWindow initialized, rendered document with Chinese/spaces, and exited cleanly."

        # 5. Compute and print Release ZIP SHA-256 checksum
        $zipHash = (Get-FileHash -Path MarkdownNativeEditor-windows-x64.zip -Algorithm SHA256).Hash
        Write-Host "========================================="
        Write-Host "Release Artifact: MarkdownNativeEditor-windows-x64.zip"
        Write-Host "SHA-256 Checksum: $zipHash"
        Write-Host "========================================="

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MarkdownNativeEditor-windows-x64
        path: MarkdownNativeEditor-windows-x64.zip

    - name: Collect and Upload Visual Screenshots Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Visual-Design-Screenshots
        path: |
          screenshots/*.png
          build/screenshots/*.png
        if-no-files-found: ignore

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        name: Native Markdown Editor ${{ github.ref_name }}
        files: |
          MarkdownNativeEditor-windows-x64.zip
          screenshots/*.png
        body: |
          ## Native Markdown Editor ${{ github.ref_name }} (Beta Release)

          基于 C++20 + Qt 6 Widgets + cmark-gfm 的高性能 Windows 原生桌面 Markdown 编辑器。

          ### 核心特性与加固验收
          - **真实 GUI 启动门禁**：`--gui-smoke-test` 严格验证主窗口构造、事件循环、文档解析与离屏完整重绘管线，支持中文与空格路径。
          - **用户偏好持久化与多屏保护**：基于 QSettings 自动保存窗口尺寸、侧栏状态、主题与字体排版；断开外接屏幕时自动恢复至主屏幕安全视口。
          - **高精度滚轮与精准块级阅读锚点**：支持高精度触控板平滑缩放，缩放时自适应锁定光标或当前阅读段落视口相对位置。
          - **查找与替换交互闭环**：匹配计数实时反馈（`x / y`）、`F3` / `Shift+F3` 循环跳转、`Escape` 键快速返回、选区与光标重绘同步。
          - **侧栏文件与大纲搜索**：字面子串过滤，安全处理 `[`、`]` 等特殊字符及中文，双向无缝同步。
          
          ### 运行环境
          - Windows 10 / 11 (x64)
          - 解压即用（已包含全部 Qt 6.8.2 运行时依赖及 SVG 渲染组件）
        prerelease: true
